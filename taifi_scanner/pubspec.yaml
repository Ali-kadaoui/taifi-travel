name: taifi_scanner
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.1

dependencies:
  camera: ^0.11.0+2
  dio: ^5.11.0
  flutter:
    sdk: flutter
  flutter_nfc_kit: ^3.6.2
  google_mlkit_text_recognition: ^0.15.0
  mobile_scanner: ^6.0.11
  shared_preferences: ^2.5.3
  vibration: ^3.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
